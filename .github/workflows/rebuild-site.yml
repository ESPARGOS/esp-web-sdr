name: Rebuild ESPARGOS website

on:
  workflow_run:
    workflows: [Check static website]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  rebuild:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-24.04
    steps:
      # Wait for the build workflow to finish so the site can find its successful run.
      - name: Trigger espargos.github.io github-pages workflow
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.ESPARGOS_GITHUB_IO_TOKEN }}
          repository: ESPARGOS/espargos.github.io
          event-type: sdr-update
