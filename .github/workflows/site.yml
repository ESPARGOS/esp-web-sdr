name: Check static website
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test firmware loading
        run: node --test tests/*.test.mjs
      - name: Upload unchanged static files
        uses: actions/upload-artifact@v4
        with:
          name: esp-websdr
          path: |
            index.html
            flash.html
            *.js
            *.css
            espargos-logo.svg
            flasher/
            firmware/
          if-no-files-found: error
