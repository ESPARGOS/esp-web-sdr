<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESP-WebSDR · USB receiver</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="style.css"><script defer src="radio.js"></script><script defer src="app.js"></script></head><body>
<header><div class="brand"><a href="https://espargos.net/" aria-label="ESPARGOS website"><img class="brand-logo" src="espargos-logo.svg" alt="ESPARGOS" width="175" height="35"></a><div><h1>ESP-WebSDR</h1><span>Raw IQ Capture with Espressif's ESP32 Chips</span></div></div><div class="connection"><span id="light"></span><span id="status">Disconnected</span><span id="deviceModel" aria-live="polite" hidden></span><button id="connect">Connect ESP-SDR</button></div></header>
<main><aside>
<label>Center frequency <span>MHz</span><input id="frequency" type="number" min="2100" max="6000" step="1" value="2412"></label><div class="presets"><button data-freq="2412">2.4 GHz</button><button data-freq="5500">5.5 GHz</button></div>
<label>RX gain mode<select id="gainMode"><option value="HARDWARE" selected>Hardware AGC</option><option value="MANUAL">Manual</option></select></label><label>Manual gain index <output id="gainValue">40</output><input id="gain" type="range" min="0" max="0" step="1" value="0" disabled></label><p id="gainStatus" class="note"></p>
<div id="bandwidthControl" hidden><label>Analog bandwidth <span>MHz</span><input id="bandwidth" type="number" min="13" max="54" step="1" value="20" disabled></label><label class="check"><input id="bandwidthOpen" type="checkbox" disabled>Wide open</label></div><label>Sample rate / nominal span<select id="rate"><option value="4000000">4 MS/s · 4 MHz</option><option value="8000000">8 MS/s · 8 MHz</option><option value="10000000">10 MS/s · 10 MHz</option><option value="16000000" disabled>16 MS/s · 16 MHz</option><option value="20000000">20 MS/s · 20 MHz</option><option value="40000000">40 MS/s · 40 MHz</option><option value="80000000" selected>80 MS/s · 80 MHz</option></select></label>
<div class="pair"><label>USB I/Q<select id="bits"><option value="8">8 + 8 bits</option><option value="10">10 + 10 bits</option></select></label><label>FFT bins<select id="fft"><option>512</option><option>1024</option><option selected>2048</option><option>4096</option></select></label></div>
<div class="divider"></div><div class="eyebrow">Display</div><label>Floor <output id="floorValue">−100 dBFS</output><input id="floor" type="range" min="-140" max="-40" value="-100"></label><label>Range <output id="rangeValue">80 dB</output><input id="range" type="range" min="20" max="120" value="80"></label><label>Trace averaging<select id="average"><option value="0">Off</option><option selected value="0.3">Short</option><option value="0.65">Medium</option><option value="0.9">High</option></select></label><label class="check"><input id="hold" type="checkbox">Max hold</label>
<div class="actions"><button id="pause" disabled>Pause</button><button id="clear">Clear</button></div></aside>
<section class="display"><div id="error" role="alert" hidden></div><div id="tuningWarning" role="status" hidden></div>
<div class="chart"><div class="charthead"><span>Power spectrum</span><span id="cursor"></span></div><canvas id="spectrum" aria-label="Received power spectrum"></canvas><div id="axis" class="axis"></div></div>
<div class="chart waterfall"><div class="charthead"><span>Waterfall </span><span id="scale">−100 → −20 dBFS</span></div><canvas id="waterfall" aria-label="Received waterfall history"></canvas><div id="empty"><div class="empty-icon">▥</div><h2>Connect ESP-SDR to start</h2></div></div>
<footer><div><b id="fps">—</b> frames/s</div><div><b id="throughput">—</b> kS/s delivered</div><div><b id="latency">—</b> ms / capture + USB</div><div><b id="peak">—</b> peak MHz</div><div id="crc">CRC —</div></footer></section></main></body></html>
